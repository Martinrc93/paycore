spring.application.name=paycore

spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:NONE}

spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=__Host-paycore-session
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

paycore.authentication.enabled=${PAYCORE_AUTHENTICATION_ENABLED:false}
paycore.authentication.success-uri=${PAYCORE_AUTHENTICATION_SUCCESS_URI:/}
paycore.authentication.logout-path=${PAYCORE_AUTHENTICATION_LOGOUT_PATH:/bff/auth/logout}
paycore.authentication.session-cleanup.delay=${PAYCORE_AUTHENTICATION_SESSION_CLEANUP_DELAY:5m}
paycore.authentication.session-cleanup.initial-delay=${PAYCORE_AUTHENTICATION_SESSION_CLEANUP_INITIAL_DELAY:5m}
paycore.authentication.session-cleanup.batch-size=${PAYCORE_AUTHENTICATION_SESSION_CLEANUP_BATCH_SIZE:1000}

spring.security.oauth2.client.registration.paycore.client-id=${PAYCORE_OIDC_CLIENT_ID:paycore-bff}
spring.security.oauth2.client.registration.paycore.client-secret=${PAYCORE_OIDC_CLIENT_SECRET:}
spring.security.oauth2.client.registration.paycore.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.paycore.redirect-uri=${PAYCORE_OIDC_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spring.security.oauth2.client.registration.paycore.scope=openid
spring.security.oauth2.client.provider.paycore.issuer-uri=${PAYCORE_OIDC_ISSUER_URI:http://localhost:8081/realms/paycore}

paycore.registration.enabled=${PAYCORE_REGISTRATION_ENABLED:false}
paycore.registration.worker-enabled=${PAYCORE_REGISTRATION_WORKER_ENABLED:false}
paycore.registration.idempotency-current-version=${PAYCORE_REGISTRATION_IDEMPOTENCY_CURRENT_VERSION:1}
paycore.registration.idempotency-secrets=${PAYCORE_REGISTRATION_IDEMPOTENCY_SECRETS:}
paycore.registration.keycloak.connect-timeout=${PAYCORE_REGISTRATION_KEYCLOAK_CONNECT_TIMEOUT:5s}
paycore.registration.keycloak.read-timeout=${PAYCORE_REGISTRATION_KEYCLOAK_READ_TIMEOUT:30s}
paycore.registration.worker.alert-threshold=${PAYCORE_REGISTRATION_WORKER_ALERT_THRESHOLD:5}
paycore.registration.worker.max-batch-size=${PAYCORE_REGISTRATION_WORKER_MAX_BATCH_SIZE:20}
paycore.registration.cleanup.delay=${PAYCORE_REGISTRATION_CLEANUP_DELAY:1h}
